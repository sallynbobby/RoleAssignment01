<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 1인 1역할 랜덤 배정기 🏫</title>

  <!-- 교실용 따뜻한 폰트 (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- 폭죽 효과 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #fbf7ee;
      --board-bg: #ffffff;
      --primary: #ff7657;
      --primary-hover: #ff5232;
      --secondary: #4dabf7;
      --accent: #ffd43b;
      --text-main: #2d3436;
      --text-sub: #636e72;
      --card-border: #f1ebd9;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* 상단 헤더 */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: #ffe3e3;
      color: #e03131;
      font-family: 'Jua', sans-serif;
      font-size: 1.1rem;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 2.7rem;
      color: #2b2b2b;
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0px #fff;
    }

    p.subtitle {
      font-size: 1.15rem;
      color: var(--text-sub);
      margin-top: 6px;
      font-weight: 500;
    }

    /* 입력창 그리드 (왼쪽: 학생, 오른쪽: 역할) */
    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .inputs-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 2.1rem;
      }
    }

    .input-card {
      background: var(--board-bg);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: var(--shadow);
      border: 3px solid #f3ece0;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.4rem;
      color: #343a40;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-tag {
      background-color: #f1f3f5;
      color: #495057;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
    }

    textarea {
      width: 100%;
      height: 200px;
      border: 2px solid #e9ecef;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.15rem;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      background: #fafbfc;
      transition: all 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 118, 87, 0.15);
    }

    /* 중앙 버튼 영역 */
    .action-area {
      text-align: center;
      margin: 20px 0 32px;
    }

    .btn-main {
      font-family: 'Jua', sans-serif;
      font-size: 1.8rem;
      padding: 16px 42px;
      background: linear-gradient(135deg, #ff7657, #ff5232);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 82, 50, 0.35);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .btn-main:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 14px 24px rgba(255, 82, 50, 0.45);
    }

    .btn-main:active {
      transform: translateY(1px) scale(0.98);
    }

    /* 유틸리티 버튼 (인쇄, 텍스트 복사) */
    .sub-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    .btn-sub {
      background: #ffffff;
      border: 2px solid #dee2e6;
      color: #495057;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-sub:hover {
      background: #e9ecef;
      border-color: #ced4da;
    }

    /* 배정 결과 영역 */
    .result-section {
      background: var(--board-bg);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow);
      border: 3px solid #f3ece0;
      display: none; /* 결과 배정 전 숨김 */
    }

    .result-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #e9ecef;
    }

    .result-header h2 {
      font-family: 'Jua', sans-serif;
      font-size: 2.2rem;
      color: #2b2b2b;
    }

    .result-notice {
      margin-top: 6px;
      font-size: 1rem;
      color: #fa5252;
      font-weight: 700;
    }

    /* 매칭 카드 그리드 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .match-card {
      background: #fdfdfd;
      border: 2px solid #f1f3f5;
      border-radius: 18px;
      padding: 16px 14px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .match-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.07);
    }

    /* 카드 상단 장식 바 */
    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #ff922b, #ffd43b);
    }

    .student-badge {
      font-family: 'Jua', sans-serif;
      font-size: 1.6rem;
      color: #212529;
      margin: 6px 0;
      word-break: keep-all;
    }

    .divider-arrow {
      font-size: 1.2rem;
      color: #adb5bd;
      margin: 2px 0;
    }

    .role-badge {
      display: inline-block;
      width: 100%;
      background: #e7f5ff;
      color: #1971c2;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 8px 6px;
      border-radius: 12px;
      word-break: keep-all;
    }

    /* 역할 없는 학생 또는 미배정 역할 상태 */
    .role-badge.waiting {
      background: #f8f9fa;
      color: #868e96;
      border: 1px dashed #ced4da;
    }

    /* TV 화면 인쇄 대응 스타일 */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .inputs-grid, .action-area, .badge, .subtitle {
        display: none !important;
      }
      .result-section {
        box-shadow: none;
        border: none;
        display: block !important;
        padding: 0;
      }
      .match-card {
        break-inside: avoid;
        border: 2px solid #ccc;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 상단 헤더 -->
    <header>
      <span class="badge">🏫 함께 만들어가는 우리 교실</span>
      <h1>🎯 1인 1역할 랜덤 배정기</h1>
      <p class="subtitle">학생 명단과 역할 목록을 확인한 뒤 배정 버튼을 눌러주세요!</p>
    </header>

    <!-- 입력 영역 (좌: 학생명단, 우: 역할목록) -->
    <div class="inputs-grid">
      <!-- 왼쪽: 학생 목록 -->
      <div class="input-card">
        <div class="card-header">
          <div class="card-title">👦👧 학생 명단</div>
          <span class="count-tag" id="studentCount">10명</span>
        </div>
        <textarea id="studentsInput" placeholder="학생 이름을 줄바꿈(엔터)으로 입력하세요.">김민준
이서아
박도윤
최지우
정하은
강예준
조수아
윤시우
임채원
한지호</textarea>
      </div>

      <!-- 오른쪽: 역할 목록 -->
      <div class="input-card">
        <div class="card-header">
          <div class="card-title">✨ 학급 역할 목록</div>
          <span class="count-tag" id="roleCount">10개</span>
        </div>
        <textarea id="rolesInput" placeholder="역할 목록을 줄바꿈(엔터)으로 입력하세요.">칠판 지우기 대장
우유 급식 당번
분리수거 요원
창문 환기 요원
도서 정리 도우미
소등 및 절전 요원
줄반장 (이동 안내)
급식 줄 도우미
학급 게시판 관리
체육 도구 정리</textarea>
      </div>
    </div>

    <!-- 중앙 버튼 -->
    <div class="action-area">
      <button type="button" class="btn-main" id="btnAssign">
        🎲 역할 랜덤 배정하기
      </button>

      <div class="sub-actions">
        <button type="button" class="btn-sub" id="btnCopy">📋 결과 텍스트 복사</button>
        <button type="button" class="btn-sub" onclick="window.print()">🖨️ 결과 인쇄 / PDF 저장</button>
      </div>
    </div>

    <!-- 배정 결과 표시 영역 -->
    <section class="result-section" id="resultSection">
      <div class="result-header">
        <h2>🎉 우리 반 역할 배정 결과 🎉</h2>
        <div id="noticeMsg" class="result-notice"></div>
      </div>
      <div class="cards-grid" id="cardsGrid">
        <!-- JS로 매칭된 카드가 동적으로 추가됩니다 -->
      </div>
    </section>
  </div>

  <script>
    const studentsInput = document.getElementById('studentsInput');
    const rolesInput = document.getElementById('rolesInput');
    const studentCountBadge = document.getElementById('studentCount');
    const roleCountBadge = document.getElementById('roleCount');
    const btnAssign = document.getElementById('btnAssign');
    const btnCopy = document.getElementById('btnCopy');
    const resultSection = document.getElementById('resultSection');
    const cardsGrid = document.getElementById('cardsGrid');
    const noticeMsg = document.getElementById('noticeMsg');

    let currentMatches = [];

    // 줄바꿈 기준으로 텍스트를 배열로 파싱 (빈 줄 제외)
    function parseLines(textarea) {
      return textarea.value
        .split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0);
    }

    // 명수 카운트 배지 갱신
    function updateCounts() {
      const students = parseLines(studentsInput);
      const roles = parseLines(rolesInput);
      studentCountBadge.textContent = `${students.length}명`;
      roleCountBadge.textContent = `${roles.length}개`;
    }

    studentsInput.addEventListener('input', updateCounts);
    rolesInput.addEventListener('input', updateCounts);

    // Fisher-Yates 셔플 알고리즘 (공정하고 완벽한 무작위 섞기)
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 배정 로직 실행
    function assignRoles() {
      const students = parseLines(studentsInput);
      const roles = parseLines(rolesInput);

      if (students.length === 0) {
        alert('학생 명단을 최소 1명 이상 입력해주세요!');
        studentsInput.focus();
        return;
      }
      if (roles.length === 0) {
        alert('역할 목록을 최소 1개 이상 입력해주세요!');
        rolesInput.focus();
        return;
      }

      // 학생과 역할 둘 다 공정하게 랜덤 셔플
      const shuffledStudents = shuffle(students);
      const shuffledRoles = shuffle(roles);

      currentMatches = [];
      noticeMsg.textContent = '';

      const maxCount = Math.max(shuffledStudents.length, shuffledRoles.length);

      if (shuffledStudents.length > shuffledRoles.length) {
        noticeMsg.textContent = `💡 학생 수(${shuffledStudents.length}명)가 역할 수(${shuffledRoles.length}개)보다 많아 일부 학생은 '휴식/자유'로 배정되었습니다.`;
      } else if (shuffledStudents.length < shuffledRoles.length) {
        noticeMsg.textContent = `💡 역할 수(${shuffledRoles.length}개)가 학생 수(${shuffledStudents.length}명)보다 많아 남은 역할이 있습니다.`;
      }

      for (let i = 0; i < maxCount; i++) {
        const student = shuffledStudents[i] || '— (남은 역할)';
        const role = shuffledRoles[i] || '자유 / 도우미';
        currentMatches.push({ student, role, isExtraRole: !shuffledStudents[i], isRest: !shuffledRoles[i] });
      }

      // 카드 렌더링
      renderCards(currentMatches);

      // 결과 화면 보이기 및 스크롤 이동
      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // 축하 폭죽 효과 터트리기 🎉
      celebrate();
    }

    // 결과 카드 생성
    function renderCards(matches) {
      cardsGrid.innerHTML = '';

      matches.forEach(item => {
        const card = document.createElement('div');
        card.className = 'match-card';

        const isSpecial = item.isRest || item.isExtraRole;

        card.innerHTML = `
          <div class="student-badge">${item.student}</div>
          <div class="divider-arrow">▼</div>
          <div class="role-badge ${isSpecial ? 'waiting' : ''}">${item.role}</div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    // 화려한 폭죽 애니메이션
    function celebrate() {
      if (typeof confetti !== 'function') return;

      const duration = 2.5 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

      function randomInRange(min, max) {
        return Math.random() * (max - min) + min;
      }

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    }

    // 결과 텍스트 복사 (메신저/알림장/쿨메신저 공유용)
    btnCopy.addEventListener('click', () => {
      if (!currentMatches || currentMatches.length === 0) {
        alert('먼저 역할을 배정해주세요!');
        return;
      }

      const text = currentMatches
        .map((m, idx) => `${idx + 1}. ${m.student} ➔ ${m.role}`)
        .join('\n');

      const fullText = `[우리 반 1인 1역할 배정 결과]\n\n${text}`;

      navigator.clipboard.writeText(fullText).then(() => {
        alert('📋 배정 결과가 클립보드에 복사되었습니다!\n알림장이나 메신저에 바로 붙여넣기(Ctrl+V)하세요.');
      }).catch(() => {
        alert('복사에 실패했습니다. 브라우저 권한을 확인해주세요.');
      });
    });

    btnAssign.addEventListener('click', assignRoles);
    updateCounts();
  </script>
</body>
</html>
